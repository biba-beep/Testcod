name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare
        run: |
          mkdir www
          cp index.html www/index.html
          curl -L -o py.tar.bz2 https://github.com/pyodide/pyodide/releases/download/0.26.4/pyodide-0.26.4.tar.bz2
          tar xjf py.tar.bz2
          mv pyodide www/pyodide
          rm py.tar.bz2
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init PocketCode com.pocketcode.app --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PocketCode-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
